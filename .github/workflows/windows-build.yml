name: Build FrameLock for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            cmake_arch: x64
            suffix: 64
          - name: x86
            cmake_arch: Win32
            suffix: 32

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/FrameLock${{ matrix.suffix }}.exe" dist/
          Copy-Item "build/Release/FrameLockHook${{ matrix.suffix }}.dll" dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLock-Windows-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
