name: Build FrameLock for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure and build x64
        run: |
          cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64
          cmake --build build64 --config Release --parallel

      - name: Configure and build x86
        run: |
          cmake -S . -B build32 -G "Visual Studio 17 2022" -A Win32
          cmake --build build32 --config Release --parallel

      - name: Assemble artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build64/Release/FrameLock64.exe dist/
          Copy-Item build64/Release/FrameLockHook64.dll dist/
          Copy-Item build32/Release/FrameLock32.exe dist/
          Copy-Item build32/Release/FrameLockHook32.dll dist/

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: FrameLock-Windows
          path: dist/*
          if-no-files-found: error
