name: Windows Buildon:  push:    branches:      - main  workflow_dispatch:jobs:  build:    runs-on: windows-latest    steps:      - uses: actions/checkout@v5      - name: Configure        run: cmake -S . -B build -A x64      - name: Build        run: cmake --build build --config Release      - name: Upload EXE        uses: actions/upload-artifact@v5        with:          name: FrameLock-x64          path: build/Release/*.exe